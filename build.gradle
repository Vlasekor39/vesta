plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.vesta.hudbridge'
    compileSdk 34

    defaultConfig {
        applicationId "ru.vesta.hudbridge"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
}
